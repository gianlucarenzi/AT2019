# ld65 config for the C64 build of the RMT player on the PC (rmtplay -c64):
# ../../../rmt_cbm64/src/rmtplayr.s (-D RMT_C64), sidrmt.s and the SID
# frequency tables, at fixed addresses, one raw binary. The zero page is the
# one of the C64 program (RMTZP at $22, src/rmt_cbm64.cfg there).
MEMORY {
    RMTZPMEM: start = $0022, size = $0013, type = rw, define = yes;
    RAM:      start = $A000, size = $2000, type = rw, file = %O, fill = yes;
}
SEGMENTS {
    RMTZP:    load = RMTZPMEM, type = zp;
    RMTTAB:   load = RAM, type = ro, align = $100, optional = yes;
    SIDTAB:   load = RAM, type = rw, align = $100;
    CODE:     load = RAM, type = rw;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw;
    BSS:      load = RAM, type = bss;
}
