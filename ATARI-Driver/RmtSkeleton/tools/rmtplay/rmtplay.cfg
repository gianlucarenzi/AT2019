# ld65 config for the PC build of the RMT player (tools/rmtplay)
# The player runs on a 6502 emulator: fixed addresses, one raw binary.
MEMORY {
    ZP:  start = $0080, size = $0040, type = rw;
    RAM: start = $A000, size = $1800, type = rw, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    RMTTAB:   load = RAM, type = ro, align = $100;
    CODE:     load = RAM, type = rw;
    BSS:      load = RAM, type = bss;
}
